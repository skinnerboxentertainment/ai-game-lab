<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Game Lab — Sandbox Template</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
  </style>
</head>
<body>
  <script src="littlejs.js"></script>
  <script>
  // AI Game Lab sandbox template — single-file LittleJS game.
  // Whole game + engine in one context: the agent can hold it, iterate on one
  // file, and see the full diff. No bundler, no build step (open index.html).

  // --- Deterministic seeded RNG (lab rule: same seed -> same game) ---
  const seed = new URLSearchParams(location.search).get("seed") || 1337;
  let rngState = seed >>> 0;
  function rand() {
    rngState |= 0; rngState = (rngState + 0x6d2b79f5) | 0;
    let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const COUNT = 60;
  const balls = [];

  class Ball extends EngineObject {
    constructor() {
      super(rand() * mainCanvasSize.x, rand() * mainCanvasSize.y, vec2(14, 14));
      this.color = new Color(rand(), rand(), rand(), 1);
      this.velocity = vec2((rand() - 0.5) * 300, (rand() - 0.5) * 300);
      balls.push(this);
    }
    update() {
      // Bounce off screen edges.
      if (this.pos.x < 0 || this.pos.x > mainCanvasSize.x) this.velocity.x *= -1;
      if (this.pos.y < 0 || this.pos.y > mainCanvasSize.y) this.velocity.y *= -1;
      super.update();
    }
  }

  // --- LittleJS callbacks (passed to engineInit below, per the engine API) ---

  function gameInit() {
    for (let i = 0; i < COUNT; i++) new Ball();
  }

  function gameUpdate() {
    // Click: spawn a deterministic particle burst + a sound.
    if (mouseWasPressed(0)) {
      new ParticleEmitter(
        mousePos,                     // pos
        0,                            // angle
        10,                           // emitSize (circle diameter)
        0.3,                          // emitTime (seconds the emitter lives)
        120,                          // emitRate (particles per second)
        PI,                           // emitConeAngle
        undefined,                    // tileInfo (untextured)
        new Color(1, rand(), rand(), 1), // colorStartA
        new Color(rand(), 1, rand(), 1), // colorStartB
        new Color(1, 1, 1, 0),        // colorEndA
        new Color(1, 1, 1, 0),        // colorEndB
        0.6,                          // particleTime
        3,                            // sizeStart
        7,                            // sizeEnd
        0.15,                         // speed (world units per frame @60fps)
        0.05,                         // angleSpeed
        0.95,                         // damping
        1,                            // angleDamping
        0,                            // gravityScale
        PI,                           // particleConeAngle
        0.2,                          // fadeRate
        0.3,                          // randomness
        false,                        // collideTiles
        true,                         // additive
        true,                         // randomColorLinear
      );
      playSound(new Sound([, , 500, , 0.1, 0.2, 1, 1.5, , 50]));
    }
  }

  function gameUpdatePost() {
    // Title + seed readout (determinism demo: ?seed= changes the layout).
    drawTextScreen(
      "AI GAME LAB — SANDBOX", vec2(10, 10), 24,
      new Color(1, 1, 1), 0, new Color(0, 0, 0), "left"
    );
    drawTextScreen(
      "seed " + seed + " — click for sparks", vec2(10, 36), 14,
      new Color(0.7, 0.9, 0.7), 0, new Color(0, 0, 0), "left"
    );
  }

  // Start the engine with the game callbacks.
  engineInit(gameInit, gameUpdate, gameUpdatePost);
  </script>
</body>
</html>
