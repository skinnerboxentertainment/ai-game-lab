<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Game Lab — Sandbox Template</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
  </style>
</head>
<body>
  <script src="littlejs.js"></script>
  <script>
  // AI Game Lab sandbox template — single-file LittleJS game.
  // Whole game + engine in one context: the agent can hold it, iterate on one
  // file, and see the full diff. No bundler, no build step (open index.html).

  // --- Deterministic seeded RNG (lab rule: same seed -> same game) ---
  const seed = new URLSearchParams(location.search).get("seed") || 1337;
  let rngState = seed >>> 0;
  function rand() {
    rngState |= 0; rngState = (rngState + 0x6d2b79f5) | 0;
    let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const COUNT = 60;
  const balls = [];

  class Ball extends EngineObject {
    constructor() {
      super(rand() * mainCanvasSize.x, rand() * mainCanvasSize.y, vec2(14, 14));
      this.color = new Color(rand(), rand(), rand(), 1);
      this.velocity = vec2((rand() - 0.5) * 300, (rand() - 0.5) * 300);
      balls.push(this);
    }
    update() {
      // Bounce off screen edges.
      if (this.pos.x < 0 || this.pos.x > mainCanvasSize.x) this.velocity.x *= -1;
      if (this.pos.y < 0 || this.pos.y > mainCanvasSize.y) this.velocity.y *= -1;
      super.update();
    }
  }

  gameInit() {
    for (let i = 0; i < COUNT; i++) new Ball();
  }

  gameUpdate() {
    // Click: spawn a deterministic particle burst + a sound.
    if (mouseWasPressed(0)) {
      for (let i = 0; i < 12; i++) {
        new Particle(
          mousePos, rand() * 2 * PI, rand() * 200,
          0.6, this.color = new Color(1, rand(), rand(), 1)
        );
      }
      playSound(new Sound([, , 500, , 0.1, 0.2, 1, 1.5, , 50]));
    }
  }

  gameUpdatePost() {
    // Title + seed readout (determinism demo: ?seed= changes the layout).
    drawText(
      "AI GAME LAB — SANDBOX", vec2(4, 4), 24,
      new Color(1, 1, 1), 0, 0, 1
    );
    drawText(
      "seed " + seed + " — click for sparks — drag to apply impulse",
      vec2(4, 28), 14, new Color(0.7, 0.9, 0.7), 0, 0, 1
    );
  }

  engineInit();
  </script>
</body>
</html>
